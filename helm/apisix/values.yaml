# APISIX Helm Chart Values
# 企业级生产级配置

replicaCount: 3

image:
  repository: apache/apisix
  tag: 3.9.0-debian
  pullPolicy: IfNotPresent

# 资源限制 - 生产级配置
resources:
  requests:
    cpu: "4"
    memory: "8Gi"
  limits:
    cpu: "8"
    memory: "16Gi"

# 节点亲和性 - 跨可用区部署
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
    - labelSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - apisix
      topologyKey: topology.kubernetes.io/zone

# 健康检查
livenessProbe:
  httpGet:
    path: /healthz
    port: 9091
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz
    port: 9091
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 2

# 水平自动扩缩容
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# APISIX 配置
apisix:
  nodeList:
    - apisix:9180
  enableHttp2: true
  enableHttp3: false
  enableIpv6: false

  # 数据面配置
  dataPlane:
    http:
      listen: 9080
    https:
      listen: 9443
      enable: true
      existingCert: ""
      existingCertSecret: ""

  # 控制面配置
  controlPlane:
    enabled: true
    dashboard:
      enabled: true
      replicaCount: 3
      image:
        repository: apache/apisix-dashboard
        tag: 3.0.1-alpine
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: "2"
          memory: "4Gi"
        limits:
          cpu: "4"
          memory: "8Gi"

  # 插件配置
  plugins:
    - limit-req
    - limit-count
    - limit-conn
    - key-auth
    - jwt-auth
    - prometheus
    - node-status
    - health-check
    - proxy-cache
    - proxy-mirror
    - request-id
    - zipkin
    - opentelemetry
    - serverless-pre-function
    - serverless-post-function
    - request-validation
    - response-rewrite
    - fault-injection
    - traffic-split
    - cors
    - redirect
    - rewrite
    - echo
    - log-rotate

  # 插件元数据配置
  pluginAttrs:
    prometheus:
      export_addr:
        ip: 0.0.0.0
        port: 9091

  # 配置中心
  configCenter: nacos
  nacos:
    host:
      - nacos-headless.api-gateway.svc.cluster.local
    port: 8848
    prefix: /nacos
    username: nacos
    password: nacos

  # 依赖存储
  etcd:
    enabled: false
  redis:
    enabled: true
    host: redis-headless.api-gateway.svc.cluster.local
    port: 6379
    password: ""
    db: 0
    clusterNodes:
      - redis-0.redis-headless.api-gateway.svc.cluster.local:6379
      - redis-1.redis-headless.api-gateway.svc.cluster.local:6379
      - redis-2.redis-headless.api-gateway.svc.cluster.local:6379

  # 日志配置
  logs:
    accessLog:
      enable: true
      file: /dev/stdout
    errorLog:
      enable: true
      file: /dev/stderr
      level: warn

  # 自定义 Nginx 配置
  customConfig:
    workerProcesses: auto
    workerConnections: 10240
    enableCPUAffinity: true
    workerRlimitNofile: 655350

service:
  type: LoadBalancer
  annotations: {}
  http:
    enabled: true
    servicePort: 80
    containerPort: 9080
  https:
    enabled: true
    servicePort: 443
    containerPort: 9443
  tls:
    certs: []
  tcp: []
  udp: []

ingress:
  enabled: false

# 持久化存储
persistence:
  enabled: false
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi

# Pod 安全策略
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# 监控配置
serviceMonitor:
  enabled: true
  interval: 15s
  namespace: api-gateway

# Pod 中断预算
podDisruptionBudget:
  enabled: true
  minAvailable: 2
