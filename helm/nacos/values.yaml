# Nacos Helm Chart Values
# 企业级生产级配置

image:
  repository: nacos/nacos-server
  tag: v2.3.1
  pullPolicy: IfNotPresent

# 资源限制
resources:
  requests:
    cpu: "2"
    memory: "4Gi"
  limits:
    cpu: "4"
    memory: "8Gi"

# 副本数
replicaCount: 3

# 配置模式
mode: cluster
persistence:
  enabled: true
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 20Gi

# 数据库配置
database:
  type: postgresql
  postgresql:
    enabled: true
    host: postgresql-primary.api-gateway.svc.cluster.local
    port: 5432
    database: nacos
    username: nacos
    password: ""
    existingSecret: ""
    existingSecretPasswordKey: postgres-password

# Nacos 配置
nacos:
  core:
    auth:
      enabled: true
      token:
        enabled: true
        secret: ""
        expire:
          seconds: 7200
      system:
        type: nacos
    config:
      encrypted:
        enabled: true
        key: ""
  plugin:
    database:
      postgresql:
        driver: org.postgresql.Driver

# 健康检查
livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 5

readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 5

# 节点亲和性 - 跨可用区部署
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
    - labelSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - nacos
      topologyKey: topology.kubernetes.io/zone

# 监控配置
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 15s
    namespace: api-gateway

# Pod 中断预算
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Nacos 服务配置
service:
  type: ClusterIP
  ports:
    http: 8848
    clientGrpc: 9848
    raftGrpc: 9849
