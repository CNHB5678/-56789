# PostgreSQL Helm Chart Values
# 企业级生产级配置

image:
  repository: bitnami/postgresql
  tag: 16.2.0-debian-12-r0
  pullPolicy: IfNotPresent

# 资源限制
resources:
  requests:
    cpu: "2"
    memory: "4Gi"
  limits:
    cpu: "4"
    memory: "8Gi"

# 架构模式
architecture: replication

# 主节点配置
primary:
  name: primary
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 50Gi
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/component
            operator: In
            values:
            - primary
        topologyKey: topology.kubernetes.io/zone

# 从节点配置
readReplicas:
  name: read
  replicaCount: 2
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 50Gi
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/component
            operator: In
            values:
            - read
        topologyKey: topology.kubernetes.io/zone

# 认证配置
auth:
  enablePostgresUser: true
  postgresPassword: ""
  username: apisix
  password: ""
  database: apisix
  existingSecret: ""
  existingSecretPasswordKey: postgres-password
  replicationUsername: repl_user
  replicationPassword: ""

# PostgreSQL 配置
configuration: |-
  max_connections = 500
  shared_buffers = 2GB
  effective_cache_size = 6GB
  maintenance_work_mem = 512MB
  checkpoint_completion_target = 0.9
  wal_buffers = 16MB
  default_statistics_target = 100
  random_page_cost = 1.1
  effective_io_concurrency = 200
  work_mem = 4MB
  min_wal_size = 1GB
  max_wal_size = 4GB
  max_worker_processes = 4
  max_parallel_workers_per_gather = 2
  max_parallel_workers = 4
  max_parallel_maintenance_workers = 2
  log_destination = 'stderr'
  logging_collector = on
  log_directory = 'log'
  log_filename = 'postgresql-%Y-%m-%d.log'
  log_min_duration_statement = 1000
  log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
  log_statement = 'ddl'
  log_connections = on
  log_disconnections = on
  log_duration = on
  log_error_verbosity = default

# 备份配置
backup:
  enabled: true
  cronjob:
    enabled: true
    schedule: "0 2 * * *"
    image:
      repository: bitnami/postgresql-repmgr
      tag: 16.2.0-debian-12-r0
      pullPolicy: IfNotPresent
    persistence:
      enabled: true
      storageClass: ""
      accessModes:
        - ReadWriteOnce
      size: 100Gi

# 健康检查
livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 5

readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 5

# 监控配置
metrics:
  enabled: true
  image:
    repository: bitnami/postgres-exporter
    tag: 0.15.0-debian-12-r0
    pullPolicy: IfNotPresent
  serviceMonitor:
    enabled: true
    interval: 15s
    namespace: api-gateway

# Pod 中断预算
podDisruptionBudget:
  enabled: true
  minAvailable:
    primary: 1
    readReplicas: 1
