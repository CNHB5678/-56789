# Observability Stack Helm Values
# 企业级可观测性栈配置

prometheus:
  enabled: true
  server:
    resources:
      requests:
        cpu: 1
        memory: 2Gi
      limits:
        cpu: 2
        memory: 4Gi
    persistentVolume:
      enabled: true
      size: 50Gi
    serviceMonitor:
      enabled: true
    additionalScrapeConfigs:
      - job_name: 'apisix'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['api-gateway']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: apisix
            action: keep

grafana:
  enabled: true
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi
  persistence:
    enabled: true
    size: 10Gi
  adminUser: admin
  adminPassword: admin
  service:
    type: ClusterIP
    port: 80
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://prometheus-server
          access: proxy
          isDefault: true
        - name: Loki
          type: loki
          url: http://loki
          access: proxy
          editable: false

loki:
  enabled: true
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1
      memory: 2Gi
  persistence:
    enabled: true
    size: 50Gi

skywalking:
  enabled: true
  oap:
    image:
      repository: apache/skywalking-oap-server
      tag: 9.7.0
    resources:
      requests:
        cpu: 1
        memory: 2Gi
      limits:
        cpu: 2
        memory: 4Gi
  ui:
    image:
      repository: apache/skywalking-ui
      tag: 9.7.0
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 1Gi
    service:
      type: ClusterIP
      port: 80
