# Redis Cluster Helm Chart Values
# 企业级生产级配置

cluster:
  enabled: true
  nodes: 6
  replicas: 1

image:
  repository: bitnami/redis
  tag: 7.2.4-debian-12-r0
  pullPolicy: IfNotPresent

# 资源限制
resources:
  requests:
    cpu: "2"
    memory: "4Gi"
  limits:
    cpu: "4"
    memory: "8Gi"

# 持久化配置
persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 20Gi

# 安全配置
auth:
  enabled: true
  password: ""
  existingSecret: ""
  existingSecretPasswordKey: redis-password

# 配置
configmap: |-
  appendonly yes
  appendfsync everysec
  save 900 1
  save 300 10
  save 60 10000
  maxmemory-policy allkeys-lru
  maxmemory 7gb
  tcp-keepalive 60
  timeout 300
  slowlog-log-slower-than 10000
  slowlog-max-len 128
  client-output-buffer-limit normal 0 0 0
  client-output-buffer-limit replica 256mb 64mb 60
  client-output-buffer-limit pubsub 32mb 8mb 60

# 健康检查
livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 5

readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 5

# 节点亲和性 - 跨可用区部署
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
    - labelSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - redis
      topologyKey: topology.kubernetes.io/zone

# 监控配置
metrics:
  enabled: true
  image:
    repository: bitnami/redis-exporter
    tag: 1.58.0-debian-12-r0
    pullPolicy: IfNotPresent
  serviceMonitor:
    enabled: true
    interval: 15s
    namespace: api-gateway

# Pod 中断预算
podDisruptionBudget:
  enabled: true
  minAvailable: 3
