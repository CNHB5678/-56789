version: '3.8'

services:
  # Redis Cluster (3主3从)
  redis-0:
    image: bitnami/redis:7.2.4-debian-12-r0
    container_name: api-gateway-redis-0
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - REDIS_NODES=redis-0,redis-1,redis-2,redis-3,redis-4,redis-5
      - REDIS_CLUSTER_CREATOR=yes
      - REDIS_CLUSTER_REPLICAS=1
      - REDIS_MAXMEMORY_POLICY=allkeys-lru
      - REDIS_MAXMEMORY=7gb
    ports:
      - "6379:6379"
    volumes:
      - redis-data-0:/bitnami/redis/data
    networks:
      - api-gateway
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-1:
    image: bitnami/redis:7.2.4-debian-12-r0
    container_name: api-gateway-redis-1
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - REDIS_NODES=redis-0,redis-1,redis-2,redis-3,redis-4,redis-5
      - REDIS_MAXMEMORY_POLICY=allkeys-lru
      - REDIS_MAXMEMORY=7gb
    ports:
      - "6380:6379"
    volumes:
      - redis-data-1:/bitnami/redis/data
    networks:
      - api-gateway
    depends_on:
      - redis-0

  redis-2:
    image: bitnami/redis:7.2.4-debian-12-r0
    container_name: api-gateway-redis-2
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - REDIS_NODES=redis-0,redis-1,redis-2,redis-3,redis-4,redis-5
      - REDIS_MAXMEMORY_POLICY=allkeys-lru
      - REDIS_MAXMEMORY=7gb
    ports:
      - "6381:6379"
    volumes:
      - redis-data-2:/bitnami/redis/data
    networks:
      - api-gateway
    depends_on:
      - redis-0

  redis-3:
    image: bitnami/redis:7.2.4-debian-12-r0
    container_name: api-gateway-redis-3
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - REDIS_NODES=redis-0,redis-1,redis-2,redis-3,redis-4,redis-5
      - REDIS_MAXMEMORY_POLICY=allkeys-lru
      - REDIS_MAXMEMORY=7gb
    ports:
      - "6382:6379"
    volumes:
      - redis-data-3:/bitnami/redis/data
    networks:
      - api-gateway
    depends_on:
      - redis-0

  redis-4:
    image: bitnami/redis:7.2.4-debian-12-r0
    container_name: api-gateway-redis-4
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - REDIS_NODES=redis-0,redis-1,redis-2,redis-3,redis-4,redis-5
      - REDIS_MAXMEMORY_POLICY=allkeys-lru
      - REDIS_MAXMEMORY=7gb
    ports:
      - "6383:6379"
    volumes:
      - redis-data-4:/bitnami/redis/data
    networks:
      - api-gateway
    depends_on:
      - redis-0

  redis-5:
    image: bitnami/redis:7.2.4-debian-12-r0
    container_name: api-gateway-redis-5
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - REDIS_NODES=redis-0,redis-1,redis-2,redis-3,redis-4,redis-5
      - REDIS_MAXMEMORY_POLICY=allkeys-lru
      - REDIS_MAXMEMORY=7gb
    ports:
      - "6384:6379"
    volumes:
      - redis-data-5:/bitnami/redis/data
    networks:
      - api-gateway
    depends_on:
      - redis-0

  # PostgreSQL (主从复制)
  postgresql-primary:
    image: bitnami/postgresql:16.2.0-debian-12-r0
    container_name: api-gateway-postgresql-primary
    environment:
      - POSTGRESQL_REPLICATION_MODE=master
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_USERNAME=apisix
      - POSTGRESQL_PASSWORD=apisix_password
      - POSTGRESQL_DATABASE=apisix
    ports:
      - "5432:5432"
    volumes:
      - postgresql-primary-data:/bitnami/postgresql
      - ./postgresql.conf:/opt/bitnami/postgresql/conf/postgresql.conf:ro
    networks:
      - api-gateway
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "apisix", "-d", "apisix"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgresql-read-0:
    image: bitnami/postgresql:16.2.0-debian-12-r0
    container_name: api-gateway-postgresql-read-0
    environment:
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_MASTER_HOST=postgresql-primary
      - POSTGRESQL_MASTER_PORT_NUMBER=5432
      - POSTGRESQL_USERNAME=apisix
      - POSTGRESQL_PASSWORD=apisix_password
      - POSTGRESQL_DATABASE=apisix
    ports:
      - "5433:5432"
    volumes:
      - postgresql-read-0-data:/bitnami/postgresql
    networks:
      - api-gateway
    depends_on:
      - postgresql-primary

  postgresql-read-1:
    image: bitnami/postgresql:16.2.0-debian-12-r0
    container_name: api-gateway-postgresql-read-1
    environment:
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_MASTER_HOST=postgresql-primary
      - POSTGRESQL_MASTER_PORT_NUMBER=5432
      - POSTGRESQL_USERNAME=apisix
      - POSTGRESQL_PASSWORD=apisix_password
      - POSTGRESQL_DATABASE=apisix
    ports:
      - "5434:5432"
    volumes:
      - postgresql-read-1-data:/bitnami/postgresql
    networks:
      - api-gateway
    depends_on:
      - postgresql-primary

  # Nacos (3节点集群)
  nacos-0:
    image: nacos/nacos-server:v2.3.1
    container_name: api-gateway-nacos-0
    environment:
      - MODE=cluster
      - NACOS_NODES=nacos-0,nacos-1,nacos-2
      - SPRING_DATASOURCE_PLATFORM=postgresql
      - POSTGRESQL_SERVICE_HOST=postgresql-primary
      - POSTGRESQL_SERVICE_PORT=5432
      - POSTGRESQL_SERVICE_DB=nacos
      - POSTGRESQL_SERVICE_USER=nacos
      - POSTGRESQL_SERVICE_PASSWORD=nacos_password
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=SecretKey01234567890123456789012345678901234567890123456789
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - nacos-data-0:/home/nacos/data
      - nacos-logs-0:/home/nacos/logs
    networks:
      - api-gateway
    depends_on:
      - postgresql-primary
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  nacos-1:
    image: nacos/nacos-server:v2.3.1
    container_name: api-gateway-nacos-1
    environment:
      - MODE=cluster
      - NACOS_NODES=nacos-0,nacos-1,nacos-2
      - SPRING_DATASOURCE_PLATFORM=postgresql
      - POSTGRESQL_SERVICE_HOST=postgresql-primary
      - POSTGRESQL_SERVICE_PORT=5432
      - POSTGRESQL_SERVICE_DB=nacos
      - POSTGRESQL_SERVICE_USER=nacos
      - POSTGRESQL_SERVICE_PASSWORD=nacos_password
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=SecretKey01234567890123456789012345678901234567890123456789
    ports:
      - "8849:8848"
      - "9850:9848"
      - "9851:9849"
    volumes:
      - nacos-data-1:/home/nacos/data
      - nacos-logs-1:/home/nacos/logs
    networks:
      - api-gateway
    depends_on:
      - nacos-0

  nacos-2:
    image: nacos/nacos-server:v2.3.1
    container_name: api-gateway-nacos-2
    environment:
      - MODE=cluster
      - NACOS_NODES=nacos-0,nacos-1,nacos-2
      - SPRING_DATASOURCE_PLATFORM=postgresql
      - POSTGRESQL_SERVICE_HOST=postgresql-primary
      - POSTGRESQL_SERVICE_PORT=5432
      - POSTGRESQL_SERVICE_DB=nacos
      - POSTGRESQL_SERVICE_USER=nacos
      - POSTGRESQL_SERVICE_PASSWORD=nacos_password
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=SecretKey01234567890123456789012345678901234567890123456789
    ports:
      - "8850:8848"
      - "9852:9848"
      - "9853:9849"
    volumes:
      - nacos-data-2:/home/nacos/data
      - nacos-logs-2:/home/nacos/logs
    networks:
      - api-gateway
    depends_on:
      - nacos-0

  # APISIX (3个数据面节点)
  apisix-0:
    image: apache/apisix:3.9.0-debian
    container_name: api-gateway-apisix-0
    volumes:
      - ../config/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    ports:
      - "9080:9080"
      - "9443:9443"
      - "9091:9091"
    networks:
      - api-gateway
    depends_on:
      - nacos-0
      - redis-0
    restart: always

  apisix-1:
    image: apache/apisix:3.9.0-debian
    container_name: api-gateway-apisix-1
    volumes:
      - ../config/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    ports:
      - "9081:9080"
      - "9444:9443"
      - "9092:9091"
    networks:
      - api-gateway
    depends_on:
      - apisix-0
    restart: always

  apisix-2:
    image: apache/apisix:3.9.0-debian
    container_name: api-gateway-apisix-2
    volumes:
      - ../config/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    ports:
      - "9082:9080"
      - "9445:9443"
      - "9093:9091"
    networks:
      - api-gateway
    depends_on:
      - apisix-0
    restart: always

  # APISIX Dashboard
  apisix-dashboard:
    image: apache/apisix-dashboard:3.0.1-alpine
    container_name: api-gateway-dashboard
    volumes:
      - ../config/apisix/dashboard.yaml:/usr/local/apisix-dashboard/conf/conf.yaml:ro
    ports:
      - "9000:9000"
    networks:
      - api-gateway
    depends_on:
      - apisix-0
    restart: always

  # Prometheus (监控指标)
  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: api-gateway-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - api-gateway

  # Grafana (监控面板)
  grafana:
    image: grafana/grafana:10.3.3
    container_name: api-gateway-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - api-gateway
    depends_on:
      - prometheus

  # Loki (日志收集)
  loki:
    image: grafana/loki:2.9.4
    container_name: api-gateway-loki
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - api-gateway

  # Promtail (日志发送)
  promtail:
    image: grafana/promtail:2.9.4
    container_name: api-gateway-promtail
    volumes:
      - /var/log:/var/log
      - ../monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
    networks:
      - api-gateway

  # SkyWalking (链路追踪)
  skywalking-oap:
    image: apache/skywalking-oap-server:9.7.0
    container_name: api-gateway-skywalking-oap
    environment:
      - SW_STORAGE=h2
    ports:
      - "11800:11800"
      - "12800:12800"
    networks:
      - api-gateway

  skywalking-ui:
    image: apache/skywalking-ui:9.7.0
    container_name: api-gateway-skywalking-ui
    environment:
      - SW_OAP_ADDRESS=http://skywalking-oap:12800
    ports:
      - "8080:8080"
    networks:
      - api-gateway
    depends_on:
      - skywalking-oap

volumes:
  redis-data-0:
  redis-data-1:
  redis-data-2:
  redis-data-3:
  redis-data-4:
  redis-data-5:
  postgresql-primary-data:
  postgresql-read-0-data:
  postgresql-read-1-data:
  nacos-data-0:
  nacos-data-1:
  nacos-data-2:
  nacos-logs-0:
  nacos-logs-1:
  nacos-logs-2:
  prometheus-data:
  grafana-data:
  loki-data:

networks:
  api-gateway:
    name: api-gateway
    driver: bridge
