# 企业级 API 网关混沌工程实验
# 用于验证高可用和故障恢复能力

version: "1.0"

experiments:
  # 实验 1: 单点故障 - APISIX 节点终止
  - name: apisix-node-failure
    description: "模拟单个 APISIX 数据节点故障，验证流量自动切换"
    category: availability
    riskLevel: medium
    steps:
      - name: health-check-baseline
        description: "执行健康检查，获取基准数据"
        type: health-check
        duration: "1m"
      
      - name: terminate-node
        description: "终止一个 APISIX 数据节点"
        type: pod-terminate
        target:
          namespace: api-gateway
          selector: "app.kubernetes.io/name=apisix"
          count: 1
      
      - name: observe-impact
        description: "观察系统行为和流量变化"
        type: observe
        duration: "5m"
        metrics:
          - availability
          - error_rate
          - latency_p99
          - rps
      
      - name: validate-recovery
        description: "验证系统自动恢复"
        type: validate
        condition: "availability >= 99.9%"
        timeout: "10m"
      
      - name: restore-node
        description: "手动/自动恢复节点"
        type: restore
        duration: "5m"
    
    pass_criteria:
      - availability >= 99.9% during failure
      - automatic recovery within 2 minutes
      - no data loss
  
  # 实验 2: 网络分区 - AZ 隔离
  - name: availability-zone-isolation
    description: "模拟整个可用区故障，验证同城双活切换"
    category: resilience
    riskLevel: high
    steps:
      - name: baseline
        description: "建立基线数据"
        type: health-check
        duration: "2m"
      
      - name: isolate-az
        description: "隔离一个可用区的所有资源"
        type: network-isolation
        target:
          zone: "${FAILURE_ZONE}"
      
      - name: monitor-traffic
        description: "监控流量是否切换到另一个 AZ"
        type: observe
        duration: "10m"
      
      - name: validate-dr
        description: "验证灾难恢复功能"
        type: validate
        condition: "traffic_routed_to_secondary_az == 100%"
        timeout: "5m"
      
      - name: restore-network
        description: "恢复网络连接"
        type: restore
        duration: "5m"
    
    pass_criteria:
      - RTO < 5 minutes
      - RPO = 0
      - all traffic successfully routed to secondary AZ

  # 实验 3: 依赖服务故障 - Redis 故障
  - name: redis-dependency-failure
    description: "模拟 Redis 集群故障，验证降级机制"
    category: dependency
    riskLevel: high
    steps:
      - name: baseline
        type: health-check
        duration: "2m"
      
      - name: fail-redis
        description: "停止 Redis 集群"
        type: pod-terminate
        target:
          namespace: api-gateway
          selector: "app.kubernetes.io/name=redis"
          count: all
      
      - name: observe-degraded-mode
        description: "观察系统在降级模式下的表现"
        type: observe
        duration: "10m"
      
      - name: validate-degradation
        type: validate
        condition: "degraded_mode_enabled == true"
        timeout: "30s"
      
      - name: restore-redis
        type: restore
        duration: "5m"
    
    pass_criteria:
      - 系统正确进入降级模式
      - 核心 API 仍然可用
      - 无崩溃现象
      - Redis 恢复后系统自动恢复

  # 实验 4: 流量洪峰 - DDoS 模拟
  - name: traffic-surge
    description: "模拟突发高流量，验证限流和扩容机制"
    category: performance
    riskLevel: medium
    steps:
      - name: baseline
        type: health-check
        duration: "2m"
      
      - name: flood-traffic
        description: "发送突发高流量"
        type: traffic-gen
        rps: 50000
        duration: "5m"
      
      - name: observe-protection
        description: "观察限流和自动扩缩容"
        type: observe
        duration: "10m"
      
      - name: validate-protection
        type: validate
        condition: "rate_limiting_activated == true"
        timeout: "1m"
      
      - name: cool-down
        description: "恢复正常流量"
        type: restore
        duration: "5m"
    
    pass_criteria:
      - 限流机制正常工作
      - 没有系统崩溃
      - 自动扩缩容触发
      - 错误率保持在可接受范围

  # 实验 5: 配置中心故障 - Nacos 故障
  - name: nacos-config-failure
    description: "模拟 Nacos 配置中心故障，验证数据面本地缓存能力"
    category: control-plane
    riskLevel: high
    steps:
      - name: baseline
        type: health-check
        duration: "2m"
      
      - name: fail-nacos
        description: "停止 Nacos 服务"
        type: pod-terminate
        target:
          namespace: api-gateway
          selector: "app.kubernetes.io/name=nacos"
          count: all
      
      - name: test-traffic
        description: "验证流量仍然可以正常转发"
        type: traffic-test
        duration: "30m"
      
      - name: validate-caching
        type: validate
        condition: "local_config_cache_used == true"
        timeout: "1m"
      
      - name: restore-nacos
        type: restore
        duration: "5m"
    
    pass_criteria:
      - Nacos 故障不影响数据面流量转发
      - 本地配置缓存正常工作
      - Nacos 恢复后配置自动同步

# 安全检查
safety:
  pre_run_checks:
    - is_business_hours == false
    - has_approval == true
    - backup_exists == true
  
  stop_conditions:
    - error_rate > 10%
    - availability < 90%
    - oncall_acknowledged == false
    - user_requested_stop == true
