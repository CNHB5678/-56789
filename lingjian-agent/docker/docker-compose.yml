version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../media:/app/media
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/lingjian.db
      - CHROMA_DB_PATH=/app/data/chromadb
      - MEDIA_ROOT=/app/media
      - PYTHONUNBUFFERED=1
    depends_on:
      - redis
    networks:
      - lingjian-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - lingjian-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
    networks:
      - lingjian-network

networks:
  lingjian-network:
    driver: bridge

volumes:
  redis-data:
