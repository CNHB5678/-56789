apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      httpMethod: GET

  - name: Loki
    type: loki
    url: http://loki:3100
    access: proxy
    editable: false

  - name: SkyWalking
    type: datasource
    url: http://skywalking-ui:8080
    access: proxy
    editable: false
