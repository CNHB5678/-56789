# 告警通知渠道配置
# 支持多种通知方式：Email、Slack、Webhook、PagerDuty 等

notifications:
  # 1. Slack 通知（推荐）
  - name: slack-alerts
    type: slack
    isDefault: true
    sendReminder: true
    frequency: "5m"
    settings:
      recipient: "#api-gateway-alerts"
      username: "APIGatewayBot"
      iconEmoji: ":warning:"
      uploadImage: true
      httpMethod: POST
    secureSettings:
      url: "${SLACK_WEBHOOK_URL}"
  
  # 2. Email 通知
  - name: email-alerts
    type: email
    isDefault: false
    sendReminder: true
    frequency: "1h"
    settings:
      addresses:
        - "devops@yourcompany.com"
        - "oncall@yourcompany.com"
      singleEmail: false
      subject: "[API Gateway Alert] {{ .AlertName }}"
      message: |
        # {{ .AlertName }}
        
        **严重程度**: {{ .Severity }}
        **状态**: {{ .State }}
        **时间**: {{ .StartsAt }}
        
        {{ .Description }}
        
        ---
        查看详情: {{ .RuleURL }}
  
  # 3. Webhook 通知（用于内部系统集成）
  - name: webhook-alerts
    type: webhook
    isDefault: false
    sendReminder: false
    settings:
      url: "${WEBHOOK_URL}"
      httpMethod: POST
      username: "${WEBHOOK_USER}"
      password: "${WEBHOOK_PASS}"
      maxAlerts: 10
    secureSettings:
      authorizationHeader: "Bearer ${WEBHOOK_TOKEN}"
  
  # 4. PagerDuty 通知（用于 On-Call）
  - name: pagerduty-alerts
    type: pagerduty
    isDefault: false
    sendReminder: true
    frequency: "15m"
    settings:
      integrationKey: "${PD_INTEGRATION_KEY}"
      severity: "critical"
    secureSettings:
      integrationKey: "${PD_INTEGRATION_KEY}"

# 告警路由配置
routing:
  # 按严重程度路由
  - match:
      severity: critical
    receiver: [slack-alerts, email-alerts, pagerduty-alerts]
    continue: false
  
  - match:
      severity: warning
    receiver: [slack-alerts, email-alerts]
    continue: false
  
  - match:
      severity: info
    receiver: [slack-alerts]
    continue: false

# 告警聚合配置
grouping:
  - name: "node-down"
    by: ["instance"]
    interval: "10s"
  
  - name: "high-error-rate"
    by: ["service"]
    interval: "5m"

# 告警模板
templates:
  - name: "default"
    title: "{{ .AlertName }} - {{ .Severity }}"
    body: |
      # {{ .AlertName }}
      
      **严重程度**: {{ .Severity }}
      **状态**: {{ .State }}
      **开始时间**: {{ .StartsAt }}
      
      {{ .Description }}
      
      ## 详情
      
      {{ range .Labels.SortedPairs }}
      - {{ .Name }}: {{ .Value }}
      {{ end }}
      
      ---
      **查看仪表板**: {{ .RuleURL }}
      
      **操作手册**: {{ .RunbookURL }}
