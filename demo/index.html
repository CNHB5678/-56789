<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业级 API 网关 - 演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 60px;
        }
        
        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
        }
        
        .header p {
            font-size: 1.25rem;
            color: #94a3b8;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .status-card {
            background: rgba(30, 41, 59, 0.8);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid rgba(96, 165, 250, 0.2);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            margin-bottom: 40px;
        }
        
        .status-card.success {
            border-color: rgba(34, 197, 94, 0.4);
            background: rgba(34, 197, 94, 0.1);
        }
        
        .status-card h2 {
            color: #60a5fa;
            margin-bottom: 20px;
            font-size: 1.75rem;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        
        .card {
            background: rgba(30, 41, 59, 0.6);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid rgba(96, 165, 250, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border-color: rgba(96, 165, 250, 0.3);
        }
        
        .card h3 {
            color: #94a3b8;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        .card .value {
            font-size: 2rem;
            font-weight: 700;
            color: #60a5fa;
        }
        
        .card .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-top: 10px;
        }
        
        .status.online {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }
        
        .status.ready {
            background: rgba(96, 165, 250, 0.2);
            color: #60a5fa;
        }
        
        .features {
            margin-bottom: 40px;
        }
        
        .features h2 {
            color: #cbd5e1;
            margin-bottom: 25px;
            font-size: 1.5rem;
        }
        
        .features ul {
            list-style: none;
            padding: 0;
        }
        
        .features li {
            padding: 12px 0;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .features li::before {
            content: "✓";
            color: #22c55e;
            font-weight: bold;
            font-size: 1.25rem;
        }
        
        .cta {
            text-align: center;
            padding: 40px;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 12px;
        }
        
        .cta h3 {
            margin-bottom: 20px;
            color: #cbd5e1;
        }
        
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
            border: none;
            font-size: 1rem;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
        }
        
        .btn-secondary {
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.3);
        }
        
        .btn-secondary:hover {
            background: rgba(59, 130, 246, 0.2);
        }
        
        .footer {
            text-align: center;
            padding-top: 40px;
            color: #64748b;
            font-size: 0.875rem;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 企业级 API 网关</h1>
            <p>生产级 API 管理平台 - 高性能 · 高可用 · 安全可靠</p>
        </div>
        
        <div class="status-card success">
            <h2>✅ 服务运行正常</h2>
            <div class="grid">
                <div class="card">
                    <h3>API 网关状态</h3>
                    <div class="value">99.99%</div>
                    <span class="status online">ONLINE</span>
                </div>
                <div class="card">
                    <h3>请求处理</h3>
                    <div class="value">30,000+</div>
                    <span class="status ready">QPS</span>
                </div>
                <div class="card">
                    <h3>响应时间 (P99)</h3>
                    <div class="value">&lt; 300ms</div>
                    <span class="status ready">OPTIMIZED</span>
                </div>
            </div>
        </div>
        
        <div class="features">
            <h2>核心特性</h2>
            <ul>
                <li>高性能数据面/控制面分离架构</li>
                <li>多维度限流熔断和流量管理</li>
                <li>企业级安全策略和 WAF 防护</li>
                <li>完整的可观测性和监控体系</li>
                <li>Kubernetes 原生部署支持</li>
                <li>自动化 CI/CD 和运维工具链</li>
            </ul>
        </div>
        
        <div class="cta">
            <h3>开始使用 API 网关</h3>
            <div class="buttons">
                <button class="btn btn-primary" onclick="showDemo()">🎉 查看演示</button>
                <button class="btn btn-secondary" onclick="showStatus()">📊 查看状态</button>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2026 企业级 API 网关平台 · 版本 1.0.0</p>
        </div>
    </div>
    
    <script>
        function showDemo() {
            alert('🎉 欢迎使用企业级 API 网关！\n\n在真实部署中，您可以：\n• 通过 Dashboard 配置路由\n• 启用各种安全和流量插件\n• 监控完整的请求生命周期\n• 进行性能测试和故障演练');
        }
        
        function showStatus() {
            alert('📊 当前系统状态：\n\n• API 网关：正常运行\n• 依赖服务：已就绪\n• 监控系统：已激活\n• 性能指标：达标\n\n这是一个演示页面 - 在生产环境中，您将看到真实的监控数据！');
        }
        
        console.log('%c🚀 企业级 API 网关', 'font-size: 24px; font-weight: bold; color: #60a5fa;');
        console.log('%c演示页面已加载 - 欢迎！', 'color: #94a3b8;');
        console.log('%c启动时间: ' + new Date().toLocaleString(), 'color: #64748b; font-size: 12px;');
    </script>
</body>
</html>
