# APISIX Dashboard 配置文件
# 企业级生产配置

conf:
  listen:
    host: 0.0.0.0
    port: 9000
  etcd:
    endpoints:
      - "http://nacos-0:8848"
    prefix: "/apisix"
    mtls:
      key_file: ""
      cert_file: ""
      ca_file: ""

  log:
    error_log:
      level: warn
      file_path: /dev/stderr
    access_log:
      file_path: /dev/stdout

  security:
    content_security_policy: "default-src 'self'; frame-ancestors 'none'; img-src 'self' data:"
    x_frame_options: "DENY"
    x_content_type_options: "nosniff"
    x_xss_protection: "1; mode=block"

  authentication:
    secret: "secret-key-to-be-changed-in-production"
    expire_time: 3600
    users:
      - username: admin
        password: admin
      - username: viewer
        password: viewer

  max_upload_size: 1024

  allow_cross_domain: false

  conf_center: nacos

  nacos:
    hosts:
      - "http://nacos-0:8848"
      - "http://nacos-1:8848"
      - "http://nacos-2:8848"
    prefix: "/nacos"
    namespace: "public"
    group: "APISIX"
    username: "nacos"
    password: "nacos"

  config_cache:
    dir: /tmp/apisix-dashboard

  audit:
    enabled: true
    log:
      file_path: /dev/stdout
      level: info

  metrics:
    enable: true
    path: /apisix/prometheus/metrics

  profile:
    enable: false

  auto_sync:
    enable: true
    sync_interval: 10
    auto_update: true
    force_sync: false

  plugins:
    - "api-breaker"
    - "authz-casbin"
    - "authz-keycloak"
    - "aws-lambda"
    - "azure-functions"
    - "clickhouse-logger"
    - "consumer-restriction"
    - "grpc-transcode"
    - "kafka-logger"
    - "key-auth"
    - "limit-req"
    - "limit-conn"
    - "limit-count"
    - "prometheus"
    - "proxy-cache"
    - "response-rewrite"
    - "serverless-pre-function"
    - "serverless-post-function"
    - "sls-logger"
    - "syslog"
    - "udp-logger"
    - "zipkin"
    - "openid-connect"
    - "wolf-rbac"
    - "openfunction"
    - "tencent-cloud-cls"
    - "hmac-auth"
    - "basic-auth"
    - "jwt-auth"
    - "mocking"
    - "cors"
    - "referer-restriction"
    - "fault-injection"
    - "log-rotate"
    - "ext-plugin-pre-req"
    - "ext-plugin-post-req"
    - "ext-plugin-pre-resp"
    - "ext-plugin-post-resp"
    - "opentelemetry"
    - "echo"
    - "redirect"
    - "forward-auth"
    - "traffic-split"
    - "request-validation"
    - "ip-restriction"
    - "ua-restriction"
    - "request-id"
    - "proxy-mirror"
    - "gzip"
    - "real-ip"
    - "client-control"
    - "inspect"

  upstream:
    keepalive: 128
    idle_timeout: 60
    pool_size: 256
    check:
      active:
        type: http
        timeout: 1
        concurrency: 10
        host: "127.0.0.1"
        port: 80
        http_path: "/health"
        healthy:
          interval: 2
          http_statuses:
            - 200
            - 302
          successes: 2
        unhealthy:
          interval: 1
          http_statuses:
            - 500
            - 502
            - 503
            - 504
          http_failures: 3
          tcp_failures: 3
          timeouts: 3
    passive:
      type: http
      healthy:
        http_statuses:
          - 200
          - 201
          - 204
          - 206
          - 301
          - 302
          - 304
          - 307
          - 308
        successes: 5
      unhealthy:
        http_statuses:
          - 429
          - 500
          - 501
          - 502
          - 503
          - 504
          - 505
        timeouts: 3
        http_failures: 3
        tcp_failures: 3

  router:
    radixtree_uri_with_parameter: true

  # 多租户配置
  multi_tenant:
    enabled: true
    tenant_id: "tenant"
    tenants:
      - id: "default"
        name: "Default"
        description: "Default tenant"
      - id: "tenant1"
        name: "Tenant 1"
        description: "First tenant"

  # 告警配置
  alerting:
    enabled: true
    smtp:
      enabled: false
      host: ""
      port: 25
      user: ""
      password: ""
      admin_email: ""
    webhook:
      enabled: true
      url: ""
      method: POST
      headers:
        Content-Type: application/json

  # 操作审计日志配置
  audit_log:
    enabled: true
    file_path: /var/log/apisix-dashboard/audit.log
    rotation:
      max_size: 100
      max_backups: 10
      max_age: 30
      compress: true

  # 会话配置
  session:
    name: APISIX-DASHBOARD-SESSION
    secret: "session-secret-to-be-changed-in-production"
    expires: 3600
    path: /
    http_only: true
    same_site: "strict"
    secure: false

  # 安全配置
  security:
    enable_csrf: true
    csrf_secret: "csrf-secret-to-be-changed-in-production"
    allowed_origins: []
    xss_protection: true
    frame_guard: true
    hsts:
      enabled: true
      max_age: 31536000
      include_sub_domains: true

  # 数据库配置（可选）
  database:
    enabled: true
    type: postgresql
    postgresql:
      host: postgresql-primary
      port: 5432
      database: apisix
      username: apisix
      password: apisix_password
      max_open_conns: 100
      max_idle_conns: 10
      conn_max_lifetime: 60
